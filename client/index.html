<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProjectPulse</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0f1424; font-family: sans-serif; }
  .loader { display:flex; flex-direction:column; align-items:center; gap:14px; }
  svg { width:60px; height:32px; }
  path { fill:none; stroke:#00c2a8; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:60; stroke-dashoffset:60; animation: draw 1.4s ease-in-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset:60; } 50% { stroke-dashoffset:0; } 100% { stroke-dashoffset:-60; } }
  span { color:#8890a3; font-size:13px; font-family: monospace; }
</style>
</head>
<body>
  <div class="loader">
    <svg viewBox="0 0 60 30"><path d="M0 15 H16 L21 4 L27 26 L33 10 L37 15 H60"/></svg>
    <span>Loading ProjectPulse…</span>
  </div>
  <script>
    const token = localStorage.getItem('pp_token');
    window.location.replace(token ? 'dashboard.html' : 'login.html');
  </script>
</body>
</html>
